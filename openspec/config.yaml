schema: spec-driven

context: |
  Peeker is an open-source replacement for Preview.app on macOS 26+, in Swift and AppKit. AGENTS.md has the
  build, test, benchmark and git rules; REPORT.md, decisions/ and research/ hold the background study.

  Milestone: Peeker replaces Preview for the maintainer's daily use (text, Markdown, PDF, images).

  Direction (decided 2026-10-30; the plugin structure is built):
  - A plugin is an in-app code module for its file types that users can turn on or off. It owns a fast view
    mode and a full editor (Edit mode in the same tab), plus reading and writing its files. The host owns
    windows, tabs, routing, toggles, the Space panel, menus, and the plumbing for save prompts and crash
    recovery. Plugins never share with each other; shared UI pieces come in by composition. Each plugin owns
    its own viewer, and a small host contract keeps common behavior consistent (zoom, find, scroll position,
    info sidebar, first-paint timing).
  - A crash in plugin code may quit the app; unsaved edits must come back on relaunch.

  Roadmap, in order. Each change gets its own interview before its proposal is written. Done: in-app plugin
  modules (2026-10-30, see openspec/changes/archive and decisions/in-app-plugins.md); its view/edit modes
  arrive with the first full editor (PDF annotate). Also done: json-config (2026-10-30: JSON config with live
  reload and schema.json, a first Settings window with the config's problems, a menu bar icon, and a Dock icon
  only while windows are open) and extension-lists (2026-10-30: each plugin has a default list of extensions,
  plugins.<id>.extensions replaces it, one plugin per extension, Plain Text owns files with no extension).
  1. Settings window, modeled on Tinycast's (decided 2026-10-30). The config file stays the only store. Only a
     change made in the window rewrites it: every setting, defaults included, with sorted keys; while the
     file isn't valid JSON the controls lock, and bad keys are dropped on rewrite. Panes: General (the
     quick-look key, as a recorder that accepts bare Space, or Off); one pane per plugin (on/off, its
     extensions as removable tokens with a free-text Add and Reset, where adding an extension another plugin
     has offers to move it; shortcut recorders that refuse keys taken in the same plugin or by a menu, with
     reset); Permissions (Accessibility and Finder with live status and Grant Access / Open; Open at Login,
     which leaves the app menu; default app per plugin, expanding to per-extension Make Default when only
     partly default); Config File. Plugins add their own pane content only when one needs it. Missing
     Accessibility while the key is on puts a red dot on Permissions and on the menu bar icon.
  2. PDF fill, sign and annotate. Saved as standard PDF annotations that stay editable in other apps;
     signatures stored by the PDF plugin.
  Later: PDF page operations, image editing.

  Open questions:
  - Text-based formats. Plain text, logs, source, structured data (JSON, YAML, XML), CSV and Markdown differ a
    lot, and how they split into plugins (and what each one's view and edit modes are) is undecided. Needs its
    own interview. specs/text and specs/markdown describe current behavior only and haven't been reviewed.
