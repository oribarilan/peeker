schema: spec-driven

context: |
  Peeker is an open-source replacement for Preview.app on macOS 26+, in Swift and AppKit. AGENTS.md has the
  build, test, benchmark and git rules; REPORT.md, decisions/ and research/ hold the background study.

  Milestone: Peeker replaces Preview for the maintainer's daily use (text, Markdown, PDF, images).

  Direction (decided 2026-10-30; the plugin structure is built):
  - A plugin is an in-app code module for its file types that users can turn on or off. It owns a fast view
    mode and a full editor (Edit mode in the same tab), plus reading and writing its files. The host owns
    windows, tabs, routing, toggles, the Space panel, menus, and the plumbing for save prompts and crash
    recovery. Plugins never share with each other; shared UI pieces come in by composition. Each plugin owns
    its own viewer, and a small host contract keeps common behavior consistent (zoom, find, scroll position,
    info sidebar, first-paint timing).
  - A crash in plugin code may quit the app; unsaved edits must come back on relaunch.

  Roadmap, in order. Each change gets its own interview before its proposal is written. Done: in-app plugin
  modules (2026-10-30, see openspec/changes/archive and decisions/in-app-plugins.md); its view/edit modes
  arrive with the first full editor (PDF annotate). Also done: json-config (2026-10-30: JSON config with live
  reload and schema.json, a first Settings window with the config's problems, a menu bar icon, and a Dock icon
  only while windows are open) and extension-lists (2026-10-30: each plugin has a default list of extensions,
  plugins.<id>.extensions replaces it, one plugin per extension, Plain Text owns files with no extension).
  1. Settings window (openspec/changes/settings-window), modeled on Tinycast's (decided 2026-10-30). The config file stays the only store. Only a
     change made in the window rewrites it: every setting, defaults included, with sorted keys; while the
     file isn't valid JSON the controls lock, and bad keys are dropped on rewrite. Panes: General (the
     quick-look key, as a recorder that accepts bare Space, or Off); one pane per plugin (on/off, its
     extensions as removable tokens with a free-text Add and Reset, where adding an extension another plugin
     has offers to move it; shortcut recorders that refuse keys taken in the same plugin or by a menu, with
     reset); Permissions (Accessibility and Finder with live status and Grant Access / Open; Open at Login,
     which leaves the app menu; default app per plugin, expanding to per-extension Make Default when only
     partly default); Config File. Plugins add their own pane content only when one needs it. Missing
     Accessibility while the key is on puts a red dot on Permissions and on the menu bar icon.
  2. PDF fill, sign and annotate (decided 2026-10-30; openspec/changes/pdf-fill-and-sign). First version: fill
     form fields, add text boxes on flat forms (one system font, black, a size control, the box grows as you
     type), sign with a signature drawn on trackpad or mouse, and Highlight, which moves into Edit mode. Notes,
     shapes, underline and strikethrough wait. Edit mode is a host toggle (toolbar Edit button and Cmd+E) for
     documents that declare one; the PDF plugin supplies the tools (Text Box, Sign, Highlight); Plain Text keeps
     editing as today. PDFs always open in the read view, which never changes the file: form fields fill only
     in Edit mode, and Highlight's shortcut switches to Edit mode. Leaving Edit mode with unsaved changes asks
     Save / Don't Save / Cancel; Cmd+S saves without leaving; recovered edits reopen in Edit mode. Text boxes and
     signatures are placed by clicking (a signature follows the pointer), and can be moved, resized and deleted
     in Edit mode, saved or not; other apps' annotations are left alone. Undo covers every change since the
     window opened, saves included. Saved as standard PDF data: field values (never flattened), text boxes as
     free-text annotations, signatures as ink annotations. Signatures are never stored on disk; the last one
     drawn is kept in memory until Peeker quits. Edit is disabled, with the reason, for XFA forms, PDFs whose
     permissions forbid changes, locked PDFs and digitally signed PDFs. The edit tools load only when Edit mode
     turns on, so opening stays as fast. Tool shortcuts rebind like other plugin commands; Cmd+E is fixed.
  3. Find and Print (decided 2026-10-31; openspec/changes/find-and-print): a find bar for PDFs and File > Print
     for every format, in document windows only.
  4. PDF page operations (decided 2026-10-31; openspec/changes/pdf-page-operations): rotate, delete and reorder
     pages in Edit mode, from the thumbnails, the Commands menu and the toolbar; saved like other edits, with
     Undo reaching past saves. Inserting, extracting and blank pages wait.
  5. Image editing (decided 2026-10-31; openspec/changes/image-editing): Edit mode for images with crop (C),
     and a Rotate & Resize panel (Cmd+R; L, R, H, V inside); saved in place at full resolution with metadata,
     lossless when only turned. Single letters stay free for markup tools later; markup itself waits.
  6. Small Preview gaps (decided 2026-10-31; openspec/changes/small-preview-gaps): password-protected PDFs open
     view-only after a lock screen, image Actual Size and zoom below fit, animated images play.
  7. Releases (decided 2026-11-01; openspec/changes/releases): semantic version numbers, install with Homebrew, and
     updates from inside the app, on by default with a setting to turn them off, as common Mac apps do. To
     settle in the interview: the update framework (Sparkle is the usual choice), signing and notarization in
     CI, where releases and the update feed live, and how a Homebrew install and the app's own updater coexist.
  8. macOS 26 compatibility (decided 2026-11-01; openspec/changes/macos-26-compatibility): PDFKit on macOS 26 drops
     /NM when saving, so marks also carry /PeekerID; thumbnail drags need macOS 27; unit tests run on macOS 26 on
     every push to main.

  Open questions:
  - Text-based formats. Plain text, logs, source, structured data (JSON, YAML, XML), CSV and Markdown differ a
    lot, and how they split into plugins (and what each one's view and edit modes are) is undecided. Needs its
    own interview. specs/text and specs/markdown describe current behavior only and haven't been reviewed.
