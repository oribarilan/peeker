name: Peeker
options:
  bundleIdPrefix: dev.peeker
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: 0.9.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # scripts/build.sh passes a stable identity so macOS keeps Accessibility/Automation grants across rebuilds.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # CI passes PEEKER_WARNINGS_AS_ERRORS=YES (scripts/build.sh test); set here so it reaches Peeker's targets but not
    # the packages, some of which turn their own warnings off.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: $(PEEKER_WARNINGS_AS_ERRORS)
    # A release build gets its version and build number from the tag (scripts/release-version.sh); any other build
    # is a development build of the next planned release.
    MARKETING_VERSION: 0.36.6-dev
    CURRENT_PROJECT_VERSION: 0
    # Sparkle's public EdDSA key for update signatures (docs/releasing.md); empty means updates can't install.
    SPARKLE_PUBLIC_KEY: ""

targetTemplates:
  # An in-app plugin: a static framework that sees only PeekerKit. Testable, because the unit tests check plugin
  # internals and run against the Release build.
  ModulePlugin:
    type: framework.static
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
    dependencies:
      - target: PeekerKit

targets:
  # Shared by the host and plugins: the plugin contract, safe file writes, shared sidebar views.
  PeekerKit:
    type: framework.static
    platform: macOS
    sources: [Sources/PeekerKit]
    settings: { base: { GENERATE_INFOPLIST_FILE: YES } }

  # Syntax highlighting's logic, on its own so it can be fixed, optimized or removed in one place: language detection and
  # a table-driven scanner. Foundation only; the text and Markdown plugins import it, the host doesn't.
  PeekerSyntax:
    type: framework.static
    platform: macOS
    sources: [Sources/PeekerSyntax]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  Peeker:
    type: application
    platform: macOS
    sources:
      - Sources/Host
      # The release notes the "Updated to Peeker" window lists, read offline.
      - path: CHANGELOG.md
        buildPhase: resources
    dependencies:
      # Static frameworks are linked into the app binary; there's nothing to embed.
      - { target: PeekerKit, embed: false }
      - { target: PeekerImage, embed: false }
      - { target: PeekerMarkdown, embed: false }
      - package: Markdown
      - { target: PeekerPDF, embed: false }
      - { target: PeekerText, embed: false }
      - { target: PeekerTable, embed: false }
      - { target: PeekerData, embed: false }
      - { target: PeekerSyntax, embed: false }
      # The updater, and the only framework Peeker embeds: Sparkle ships as a dynamic framework with helper apps,
      # which Xcode embeds and signs by itself.
      - package: Sparkle
    scheme:
      testTargets: [HostTests, PDFTests]
    settings:
      base:
        # Notarization needs the hardened runtime; every build has it, so the screen tests drive what ships.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: packaging/Peeker.entitlements
        # The icon is Resources/AppIcon.icon (Icon Composer); the accent applies under a Multicolor system accent.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: build/Info-Peeker.plist
      properties:
        CFBundleDisplayName: Peeker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Starts as a menu bar utility; the app switches to a regular one, with a Dock icon, while windows are open.
        LSUIElement: true
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        # Updates: a daily check, on without asking (config.json can turn it off), no system profile, and no
        # silent installs: a new version is offered with its release notes.
        SUFeedURL: https://oribarilan.github.io/peeker/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: false
        NSAppleEventsUsageDescription: Peeker reads which files are selected in Finder so it can show them when you press the Peek panel key.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, public.json, public.xml, public.yaml, public.toml, com.apple.property-list, com.microsoft.ini, public.css]
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown, public.image]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown]
              public.mime-type: [text/markdown]

  PeekerMarkdown:
    templates: [ModulePlugin]
    sources: [Plugins/markdown]
    dependencies:
      - package: Markdown
      - target: PeekerSyntax

  PeekerPDF:
    templates: [ModulePlugin]
    sources: [Plugins/pdf]

  PeekerImage:
    templates: [ModulePlugin]
    sources: [Plugins/image]

  PeekerTable:
    templates: [ModulePlugin]
    sources: [Plugins/table]

  PeekerData:
    templates: [ModulePlugin]
    sources: [Plugins/data]
    dependencies:
      - target: PeekerSyntax

  PeekerText:
    templates: [ModulePlugin]
    sources: [Plugins/text]
    dependencies:
      - target: PeekerSyntax

  HostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes: ["PDF*.swift", ThumbnailDropBarTests.swift, FormPDF.swift, Fixtures]
      - path: Sources/Host
        excludes: [App/main.swift, "Resources/**"]
    dependencies:
      - target: PeekerKit
      - target: PeekerImage
      - target: PeekerPDF
      - target: PeekerMarkdown
      - target: PeekerText
      - target: PeekerTable
      - target: PeekerData
      - target: PeekerSyntax
      - package: Markdown
      - package: Sparkle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # The PDF suites run in a process of their own: PDFKit analyzes every form PDF shown in a window on a queue of its
  # own, and in a test run that analysis can take every worker thread, which stalls other tests' background work
  # (a text view's find, for one).
  PDFTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        includes: ["PDF*.swift", ThumbnailDropBarTests.swift, FormPDF.swift, TestSupport.swift]
      - path: Sources/Host
        excludes: [App/main.swift, "Resources/**"]
    dependencies:
      - target: PeekerKit
      - target: PeekerImage
      - target: PeekerPDF
      - target: PeekerMarkdown
      - target: PeekerText
      - target: PeekerTable
      - target: PeekerData
      - target: PeekerSyntax
      - package: Markdown
      - package: Sparkle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
