name: Peeker
options:
  bundleIdPrefix: dev.peeker
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: 0.9.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # scripts/build.sh passes a stable identity so macOS keeps Accessibility/Automation grants across rebuilds.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targetTemplates:
  Plugin:
    type: tool
    platform: macOS
    settings:
      base:
        SKIP_INSTALL: YES

targets:
  Peeker:
    type: application
    platform: macOS
    sources:
      - Sources/Host
      - Sources/Shared
      - path: Plugins/markdown/manifest.json
        buildPhase: { copyFiles: { destination: resources, subpath: Plugins/markdown } }
      - path: Plugins/pdf/manifest.json
        buildPhase: { copyFiles: { destination: resources, subpath: Plugins/pdf } }
      - path: Plugins/image/manifest.json
        buildPhase: { copyFiles: { destination: resources, subpath: Plugins/image } }
      - path: Plugins/text/manifest.json
        buildPhase: { copyFiles: { destination: resources, subpath: Plugins/text } }
    dependencies:
      - { target: MarkdownPlugin, embed: true, codeSign: true, copy: { destination: wrapper, subpath: Contents/Helpers } }
      - { target: PDFPlugin, embed: true, codeSign: true, copy: { destination: wrapper, subpath: Contents/Helpers } }
      - { target: ImagePlugin, embed: true, codeSign: true, copy: { destination: wrapper, subpath: Contents/Helpers } }
      - { target: TextPlugin, embed: true, codeSign: true, copy: { destination: wrapper, subpath: Contents/Helpers } }
    scheme:
      testTargets: [HostTests]
    info:
      path: build/Info-Peeker.plist
      properties:
        CFBundleDisplayName: Peeker
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: Peeker reads which files are selected in Finder so it can show them when you press the quick-look key.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, public.json, public.xml, public.yaml, public.toml]
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown, public.image]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown]
              public.mime-type: [text/markdown]

  MarkdownPlugin:
    templates: [Plugin]
    sources:
      - path: Plugins/markdown
        excludes: [manifest.json]
      - Sources/Shared
      - Sources/PluginSDK
    settings: { base: { PRODUCT_NAME: markdown-plugin } }
    dependencies:
      - package: Markdown

  PDFPlugin:
    templates: [Plugin]
    sources:
      - path: Plugins/pdf
        excludes: [manifest.json]
      - Sources/Shared
      - Sources/PluginSDK
    settings: { base: { PRODUCT_NAME: pdf-plugin } }

  ImagePlugin:
    templates: [Plugin]
    sources:
      - path: Plugins/image
        excludes: [manifest.json]
      - Sources/Shared
      - Sources/PluginSDK
    settings: { base: { PRODUCT_NAME: image-plugin } }

  TextPlugin:
    templates: [Plugin]
    sources:
      - path: Plugins/text
        excludes: [manifest.json]
      - Sources/Shared
      - Sources/PluginSDK
    settings: { base: { PRODUCT_NAME: text-plugin } }

  # Misbehaves on request (crash, hang, garbage); HostTests runs it to test plugin process handling.
  TestPlugin:
    templates: [Plugin]
    sources:
      - Tests/TestPlugin
      - Sources/Shared
      - Sources/PluginSDK
    settings: { base: { PRODUCT_NAME: test-plugin } }

  HostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes: [TestPlugin]
      - Sources/Shared
      - path: Sources/Host
        excludes: [App/main.swift]
      - path: Plugins/markdown
        excludes: [main.swift, manifest.json]
      - path: Plugins/text
        excludes: [main.swift, manifest.json]
      - path: Plugins/pdf
        excludes: [main.swift, manifest.json]
      - path: Sources/PluginSDK
    dependencies:
      - package: Markdown
      - { target: TestPlugin, link: false, embed: false }
      - { target: TextPlugin, link: false, embed: false }
      - { target: PDFPlugin, link: false, embed: false }
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
