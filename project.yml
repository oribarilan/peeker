name: PreviewPP
options:
  bundleIdPrefix: dev.previewpp
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: 0.9.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # scripts/build.sh passes a stable identity so macOS keeps Accessibility/Automation grants across rebuilds.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targetTemplates:
  Plugin:
    type: tool
    platform: macOS
    settings:
      base:
        SKIP_INSTALL: YES

targets:
  PreviewPP:
    type: application
    platform: macOS
    sources:
      - Sources/Host
      - Sources/Shared
      - path: Plugins/markdown/manifest.json
        buildPhase: { copyFiles: { destination: resources, subpath: Plugins/markdown } }
      - path: Plugins/pdf/manifest.json
        buildPhase: { copyFiles: { destination: resources, subpath: Plugins/pdf } }
      - path: Plugins/image/manifest.json
        buildPhase: { copyFiles: { destination: resources, subpath: Plugins/image } }
    dependencies:
      - { target: MarkdownPlugin, embed: true, codeSign: true, copy: { destination: wrapper, subpath: Contents/Helpers } }
      - { target: PDFPlugin, embed: true, codeSign: true, copy: { destination: wrapper, subpath: Contents/Helpers } }
      - { target: ImagePlugin, embed: true, codeSign: true, copy: { destination: wrapper, subpath: Contents/Helpers } }
    scheme:
      testTargets: [HostTests]
    info:
      path: build/Info-PreviewPP.plist
      properties:
        CFBundleDisplayName: Preview++
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: Preview++ reads which files are selected in Finder so it can show them when you press the quick-look key.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, net.daringfireball.markdown, public.image]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown]
              public.mime-type: [text/markdown]

  MarkdownPlugin:
    templates: [Plugin]
    sources:
      - path: Plugins/markdown
        excludes: [manifest.json]
      - Sources/Shared
      - Sources/PluginSDK
    settings: { base: { PRODUCT_NAME: markdown-plugin } }
    dependencies:
      - package: Markdown

  PDFPlugin:
    templates: [Plugin]
    sources:
      - path: Plugins/pdf
        excludes: [manifest.json]
      - Sources/Shared
      - Sources/PluginSDK
    settings: { base: { PRODUCT_NAME: pdf-plugin } }

  ImagePlugin:
    templates: [Plugin]
    sources:
      - path: Plugins/image
        excludes: [manifest.json]
      - Sources/Shared
      - Sources/PluginSDK
    settings: { base: { PRODUCT_NAME: image-plugin } }

  HostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/Shared
      - path: Sources/Host
        excludes: [main.swift]
      - path: Plugins/markdown
        excludes: [main.swift, manifest.json]
      - path: Sources/PluginSDK
    dependencies:
      - package: Markdown
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
