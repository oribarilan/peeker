name: PreviewPP
options:
  bundleIdPrefix: dev.previewpp
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targetTemplates:
  App:
    type: application
    platform: macOS
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    info:
      path: build/Info-${target_name}.plist
      properties:
        CFBundleDisplayName: Preview++
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
          - CFBundleTypeName: Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, net.daringfireball.markdown, public.plain-text, public.json, public.comma-separated-values-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown]
              public.mime-type: [text/markdown]

  PluginBundle:
    type: bundle
    platform: macOS
    dependencies:
      - target: PreviewPPKit
        embed: false
    settings:
      base:
        WRAPPER_EXTENSION: pppplugin
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SKIP_INSTALL: YES
    info:
      path: build/Info-${target_name}.plist
      properties:
        NSPrincipalClass: ${principalClass}

targets:
  PreviewPPKit:
    type: framework
    platform: macOS
    sources: [Sources/PreviewPPKit]
    settings:
      base:
        # The plugin ABI must survive compiler upgrades on either side.
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    info:
      path: build/Info-PreviewPPKit.plist

  # Variant A: all first-party plugins compiled into the app. Community plugins load at runtime.
  PreviewPP:
    templates: [App]
    sources:
      - Sources/Host
      - Sources/Plugins
      - Sources/Builtins/Bundled.swift
    dependencies:
      - target: PreviewPPKit
        embed: true
    scheme:
      testTargets: [HostTests]

  # Variant B: no formats compiled in. First-party plugins ship as bundles in Contents/PlugIns.
  PreviewPPLean:
    templates: [App]
    sources:
      - Sources/Host
      - Sources/Builtins/None.swift
    dependencies:
      - target: PreviewPPKit
        embed: true
      - { target: PPText, embed: true, codeSign: true, copy: { destination: plugins } }
      - { target: PPMarkdown, embed: true, codeSign: true, copy: { destination: plugins } }
      - { target: PPPDF, embed: true, codeSign: true, copy: { destination: plugins } }
      - { target: PPCSV, embed: true, codeSign: true, copy: { destination: plugins } }

  HostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Sources/Host
        excludes: [main.swift, AppDelegate.swift]
      - Sources/Plugins/CSV
      - Sources/Plugins/Markdown
    dependencies:
      - target: PreviewPPKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "@loader_path/../Frameworks @executable_path/../Frameworks"

  PPText:
    templates: [PluginBundle]
    templateAttributes: { principalClass: PPText.TextPlugin }
    sources: [Sources/Plugins/Text]
  PPMarkdown:
    templates: [PluginBundle]
    templateAttributes: { principalClass: PPMarkdown.MarkdownPlugin }
    sources: [Sources/Plugins/Markdown]
  PPPDF:
    templates: [PluginBundle]
    templateAttributes: { principalClass: PPPDF.PDFPlugin }
    sources: [Sources/Plugins/PDF]
  PPCSV:
    templates: [PluginBundle]
    templateAttributes: { principalClass: PPCSV.CSVPlugin }
    sources: [Sources/Plugins/CSV]
