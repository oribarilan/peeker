name: Peeker
options:
  bundleIdPrefix: dev.peeker
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: 0.9.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # scripts/build.sh passes a stable identity so macOS keeps Accessibility/Automation grants across rebuilds.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # A release build gets its version and build number from the tag (scripts/release-version.sh); any other build
    # is a development build.
    MARKETING_VERSION: 0.0.0-dev
    CURRENT_PROJECT_VERSION: 0
    # Sparkle's public EdDSA key for update signatures (docs/releasing.md); empty means updates can't install.
    SPARKLE_PUBLIC_KEY: ""

targetTemplates:
  # An in-app plugin: a static framework that sees only PeekerKit. Testable, because the unit tests check plugin
  # internals and run against the Release build.
  ModulePlugin:
    type: framework.static
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
    dependencies:
      - target: PeekerKit

targets:
  # Shared by the host and plugins: the plugin contract, safe file writes, shared sidebar views.
  PeekerKit:
    type: framework.static
    platform: macOS
    sources: [Sources/PeekerKit]
    settings: { base: { GENERATE_INFOPLIST_FILE: YES } }

  Peeker:
    type: application
    platform: macOS
    sources:
      - Sources/Host
    dependencies:
      # Static frameworks are linked into the app binary; there's nothing to embed.
      - { target: PeekerKit, embed: false }
      - { target: PeekerImage, embed: false }
      - { target: PeekerMarkdown, embed: false }
      - package: Markdown
      - { target: PeekerPDF, embed: false }
      - { target: PeekerText, embed: false }
      # The updater, and the only framework Peeker embeds: Sparkle ships as a dynamic framework with helper apps,
      # which Xcode embeds and signs by itself.
      - package: Sparkle
    scheme:
      testTargets: [HostTests]
    info:
      path: build/Info-Peeker.plist
      properties:
        CFBundleDisplayName: Peeker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Starts as a menu bar utility; the app switches to a regular one, with a Dock icon, while windows are open.
        LSUIElement: true
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        # Updates: a daily check, on without asking (config.json can turn it off), no system profile, and no
        # silent installs: a new version is offered with its release notes.
        SUFeedURL: https://oribarilan.github.io/peeker/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: false
        SUAllowsAutomaticUpdates: false
        NSAppleEventsUsageDescription: Peeker reads which files are selected in Finder so it can show them when you press the quick-look key.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, public.json, public.xml, public.yaml, public.toml, com.microsoft.ini, public.css]
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown, public.image]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown]
              public.mime-type: [text/markdown]

  PeekerMarkdown:
    templates: [ModulePlugin]
    sources: [Plugins/markdown]
    dependencies:
      - package: Markdown

  PeekerPDF:
    templates: [ModulePlugin]
    sources: [Plugins/pdf]

  PeekerImage:
    templates: [ModulePlugin]
    sources: [Plugins/image]

  PeekerText:
    templates: [ModulePlugin]
    sources: [Plugins/text]

  HostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Host
        excludes: [App/main.swift]
    dependencies:
      - target: PeekerKit
      - target: PeekerImage
      - target: PeekerPDF
      - target: PeekerMarkdown
      - target: PeekerText
      - package: Markdown
      - package: Sparkle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
