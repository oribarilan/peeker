<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; font: 13px -apple-system, sans-serif; }
  body { margin: 0; }
  table { border-collapse: collapse; width: 100%; }
  th { position: sticky; top: 0; background: Canvas; text-align: left; border-bottom: 1px solid GrayText; }
  th, td { padding: 3px 8px; white-space: nowrap; }
  tr:nth-child(even) td { background: color-mix(in srgb, CanvasText 5%, transparent); }
</style>
<table id="grid"></table>
<script src="main.js"></script>
